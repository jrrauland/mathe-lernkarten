<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f1f5f9">
<title>Mathe Lernkarten</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--green:#16a34a;--green-bg:#dcfce7;--red:#dc2626;--red-bg:#fee2e2;--radius:20px;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}
#screen-menu{padding:24px 16px;max-width:520px;margin:0 auto;}
.menu-header{text-align:center;padding:32px 0 28px;}
.menu-title{font-family:'Baloo 2',cursive;font-size:30px;font-weight:800;color:#1e293b;line-height:1.1}
.menu-sub{font-size:14px;color:var(--muted);font-weight:600;margin-top:8px}
.set-grid{display:flex;flex-direction:column;gap:12px;}
.set-card{background:var(--surface);border-radius:18px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;border:1.5px solid var(--border);transition:transform .15s;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.set-card:active{transform:scale(.97)}
.set-icon{font-size:36px;line-height:1;flex-shrink:0}.set-info{flex:1}
.set-title{font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;line-height:1.2}
.set-meta{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.set-arrow{font-size:20px;color:var(--muted);flex-shrink:0}
.set-badge{font-size:28px;flex-shrink:0;margin-right:4px;}
.set-progress{position:absolute;bottom:0;left:0;height:3px;}
.menu-footer{text-align:center;padding:24px 0 8px;font-size:12px;color:var(--muted);font-weight:600}
#screen-app{display:none;}
#app-inner{height:100vh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:16px;gap:10px;}
.hdr{display:flex;align-items:center;gap:10px;}
.btn-back{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-weight:700;padding:6px 12px;cursor:pointer;white-space:nowrap;}
.app-title{font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;line-height:1.2;flex:1}
.round-badge{background:var(--surface);border:1.5px solid var(--border);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center;border:1.5px solid var(--border);}
.stat-n{font-size:22px;font-weight:900;line-height:1;color:var(--text)}.stat-l{font-size:10px;font-weight:600;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.s-right .stat-n{color:var(--green)}.s-wrong .stat-n{color:var(--red)}
.prog-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s ease;width:0%}
.card-row{position:relative;}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);border:1.5px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;box-shadow:0 1px 4px rgba(0,0,0,.12);user-select:none;z-index:10;}
.nav-btn:active{background:#f1f5f9;}.nav-btn-left{left:8px;}.nav-btn-right{right:8px;}
.card-scene{width:100%;perspective:1000px;cursor:pointer;}
.card-body{width:100%;height:280px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.card-body.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 20px;}
.face-front{background:var(--surface);border:1.5px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.08);}
.face-back{transform:rotateY(180deg);box-shadow:0 2px 12px rgba(0,0,0,.08);}
.op-tag{font-size:11px;font-weight:700;padding:4px 14px;border-radius:99px;text-transform:uppercase;letter-spacing:1px;}
.problem-txt{font-family:'Baloo 2',cursive;font-size:clamp(42px,10vw,64px);font-weight:800;color:var(--text);line-height:1}
.tap-hint{font-size:12px;color:var(--muted);font-weight:600;}
.tap-hint span{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.back-eq{font-size:15px;font-weight:600;}.answer-big{font-family:'Baloo 2',cursive;font-size:clamp(64px,15vw,88px);font-weight:800;line-height:1;}
.back-q{font-size:12px;font-weight:600;color:var(--muted);}
.nl-strip{background:#f8faff;border-radius:14px;padding:14px 10px 10px;display:none;}
.nl-strip.visible{display:block;}.nl-svg{width:100%;display:block;overflow:visible;}
.btn-flip{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;padding:14px;cursor:pointer;}
.ans-row{display:none;gap:10px}
.btn-ans{flex:1;padding:14px;border-radius:14px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer;}
.btn-ans:active{transform:scale(.96)}
.btn-wrong{background:var(--red-bg);color:var(--red);border:1.5px solid #fca5a5;}
.btn-right{background:var(--green-bg);color:var(--green);border:1.5px solid #86efac;}
.weak-row{display:flex;gap:6px;flex-wrap:wrap;min-height:18px}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--red-bg);color:var(--red);}
.memory-hint{font-size:11px;color:var(--muted);text-align:center;font-weight:600}.memory-hint span{color:var(--green)}
#screen-finish{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:16px;max-width:520px;margin:0 auto;background:var(--bg);}
.finish-emoji{font-size:56px;line-height:1}.finish-title{font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;text-align:center}
.finish-sub{font-size:15px;color:var(--muted);font-weight:600;text-align:center}
.score-ring{width:110px;height:110px;position:relative}.score-ring svg{transform:rotate(-90deg)}
.score-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:26px;font-weight:800;color:var(--text)}
.weak-section{width:100%;background:var(--surface);border-radius:var(--radius);padding:16px;border:1.5px solid var(--border);}
.weak-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.weak-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--text);}.weak-item:last-child{border:none}
.err-badge{background:var(--red-bg);color:var(--red);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.save-badge{font-size:12px;color:var(--green);font-weight:700;text-align:center}
.btn-row-finish{display:flex;gap:10px;width:100%}
.btn-restart{flex:1;padding:16px;border:none;border-radius:14px;color:#fff;font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;cursor:pointer;}
.btn-reset{padding:16px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;color:var(--muted);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-back-finish{width:100%;padding:14px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;color:var(--muted);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div id="screen-menu">
  <div class="menu-header">
    <div class="menu-title">✏️ Mathe<br>Lernkarten</div>
    <div class="menu-sub">Wähle einen Kartensatz</div>
  </div>
  <div class="set-grid" id="set-grid"></div>
  <div class="menu-footer">💾 Lernfortschritt wird automatisch gespeichert</div>
</div>
<div id="screen-app">
  <div id="app-inner">
    <div class="hdr">
      <button class="btn-back" onclick="goMenu()">← Zurück</button>
      <div class="app-title" id="app-title"></div>
      <div class="round-badge" id="round-badge">1 / 20</div>
    </div>
    <div class="stats">
      <div class="stat s-total"><div class="stat-n" id="s-total">0</div><div class="stat-l">Gesamt</div></div>
      <div class="stat s-right"><div class="stat-n" id="s-right">0</div><div class="stat-l">Richtig</div></div>
      <div class="stat s-wrong"><div class="stat-n" id="s-wrong">0</div><div class="stat-l">Falsch</div></div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
    <div class="card-row">
      <button class="nav-btn nav-btn-left" onclick="navCard(-1)"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><polyline points="14,4 7,11 14,18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="card-scene" onclick="flipCard()">
        <div class="card-body" id="card-body">
          <div class="face face-front">
            <div class="op-tag" id="op-tag-front"></div>
            <div class="problem-txt" id="problem"></div>
            <div class="tap-hint"><span>Tippen zum Umdrehen</span></div>
          </div>
          <div class="face face-back" id="face-back">
            <div class="op-tag" id="op-tag-back"></div>
            <div class="back-eq" id="back-eq"></div>
            <div class="answer-big" id="answer"></div>
            <div class="back-q">Hattest du recht?</div>
          </div>
        </div>
      </div>
      <button class="nav-btn nav-btn-right" onclick="navCard(1)"><svg width="22" height="22" viewBox="0 0 22 22" fill="none"><polyline points="8,4 15,11 8,18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="nl-strip" id="nl-strip">
      <svg class="nl-svg" id="nl-svg" viewBox="0 0 340 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <button class="btn-flip" id="btn-flip" onclick="flipCard()">Antwort zeigen 👀</button>
    <div class="ans-row" id="ans-row">
      <button class="btn-ans btn-wrong" onclick="grade(false)">✗ Falsch</button>
      <button class="btn-ans btn-right" onclick="grade(true)">✓ Richtig</button>
    </div>
    <div class="weak-row" id="weak-row"></div>
    <div class="memory-hint" id="memory-hint"></div>
  </div>
</div>
<div id="screen-finish">
  <div class="finish-emoji" id="finish-emoji">🎉</div>
  <div class="finish-title" id="finish-title">Runde geschafft!</div>
  <div class="finish-sub" id="finish-sub"></div>
  <div class="score-ring">
    <svg width="110" height="110" viewBox="0 0 110 110">
      <circle cx="55" cy="55" r="46" fill="none" stroke="#e2e8f0" stroke-width="10"/>
      <circle cx="55" cy="55" r="46" fill="none" id="ring-arc" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"/>
    </svg>
    <div class="score-center" id="score-pct">0%</div>
  </div>
  <div class="save-badge">💾 Lernfortschritt gespeichert!</div>
  <div class="weak-section" id="weak-section" style="display:none">
    <div class="weak-title">⚠️ Noch üben</div><div id="weak-items"></div>
  </div>
  <div class="btn-row-finish">
    <button class="btn-restart" id="btn-restart" onclick="restart()">Nächste Runde →</button>
    <button class="btn-reset" onclick="resetProgress()">🗑 Reset</button>
  </div>
  <button class="btn-back-finish" onclick="goMenu()">← Zurück zur Übersicht</button>
</div>

const DECK=20;
let currentSet=null,deck=[],idx=0,flipped=false,correct=0,wrong=0,round=1,answered={},weights={};
function loadWeights(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):{}}catch(e){return{}}}
function saveWeights(){try{localStorage.setItem(currentSet.storage_key,JSON.stringify(weights));}catch(e){}}
function cardKey(c){return c[0]+c[1]+c[2]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(){
  const pool=[];for(const c of currentSet.cards){const w=weights[cardKey(c)]||1;for(let i=0;i<w;i++)pool.push(c)}
  shuffle(pool);const seen=new Set(),res=[];
  for(const c of pool){if(!seen.has(cardKey(c))){seen.add(cardKey(c));res.push(c)}if(res.length>=DECK)break}
  if(res.length<DECK){for(const c of shuffle([...currentSet.cards])){if(!seen.has(cardKey(c))){seen.add(cardKey(c));res.push(c)}if(res.length>=DECK)break}}
  return res;
}
function drawNumberLine(a,op,b,r){
  const svg=document.getElementById('nl-svg');
  const ACC=currentSet.color_main,ACC_M=currentSet.color_muted,ACC_D=currentSet.color_dark;
  const x0=10,xN=322,y=44,bigH=8,step=(xN-x0)/20,start=a,end=r;let out='';
  out+=`<line x1="${x0}" y1="${y}" x2="${xN+5}" y2="${y}" stroke="${ACC_D}" stroke-width="1.5" stroke-linecap="round"/>`;
  out+=`<polygon points="${xN+5},${y-4} ${xN+13},${y} ${xN+5},${y+4}" fill="${ACC_D}"/>`;
  for(let n=0;n<=20;n++){
    const x=x0+n*step,isActive=(op==='+'?(n>=start&&n<=end):(n>=end&&n<=start)),color=isActive?ACC:ACC_M;
    out+=`<line x1="${x}" y1="${y-bigH}" x2="${x}" y2="${y+bigH}" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>`;
    out+=`<text x="${x}" y="${y+bigH+14}" text-anchor="middle" font-size="11" fill="${color}" font-family="sans-serif">${n}</text>`;
  }
  if(op==='+'){for(let n=start;n<end;n++){const x1=x0+n*step,x2=x0+(n+1)*step,mx=(x1+x2)/2;out+=`<path d="M${x1},${y} Q${mx},${y-24} ${x2},${y}" fill="none" stroke="${ACC}" stroke-width="2.5" stroke-linecap="round"/>`;}}
  else{for(let n=start;n>end;n--){const x1=x0+n*step,x2=x0+(n-1)*step,mx=(x1+x2)/2;out+=`<path d="M${x1},${y} Q${mx},${y-24} ${x2},${y}" fill="none" stroke="${ACC}" stroke-width="2.5" stroke-linecap="round"/>`;}}
  out+=`<circle cx="${x0+start*step}" cy="${y}" r="5" fill="${ACC}"/>`;
  out+=`<circle cx="${x0+end*step}" cy="${y}" r="5" fill="${ACC}"/>`;
  svg.innerHTML=out;
}
function renderMenu(){
  const grid=document.getElementById('set-grid');grid.innerHTML='';
  for(const [id,s] of Object.entries(SETS)){
    const w=loadWeights(s.storage_key),weak=Object.values(w).filter(v=>v>=4).length,total=Object.keys(w).length;
    const pct=total>0?Math.max(5,Math.round((1-weak/s.cards.length)*100)):0;
    const div=document.createElement('div');div.className='set-card';
    div.innerHTML=`<div class="set-icon">${s.emoji}</div>
      <div class="set-info"><div class="set-title" style="color:${s.color_main}">${s.title}</div>
      <div class="set-meta">${s.cards.length} Aufgaben${weak>0?' · ⚠ '+weak+' im Training':total>0?' · Gut gemacht! ✓':''}</div></div>
      ${s.badge?'<div class="set-badge">'+s.badge+'</div>':''}<div class="set-arrow">›</div>
      ${total>0?'<div class="set-progress" style="background:'+s.color_main+';width:'+pct+'%"></div>':''}`;
    div.onclick=()=>startSet(id);grid.appendChild(div);
  }
}
function startSet(id){
  currentSet=SETS[id];weights=loadWeights(currentSet.storage_key);
  idx=0;correct=0;wrong=0;round=1;answered={};deck=buildDeck();
  document.getElementById('app-title').textContent=currentSet.emoji+' '+currentSet.title;
  document.getElementById('app-title').style.color=currentSet.color_main;
  document.getElementById('prog').style.background=currentSet.color_main;
  document.getElementById('face-back').style.background=currentSet.color_bg;
  document.getElementById('face-back').style.borderColor=currentSet.color_border;
  document.getElementById('nl-strip').style.borderColor=currentSet.color_border;
  document.getElementById('answer').style.color=currentSet.color_main;
  document.getElementById('back-eq').style.color=currentSet.color_dark;
  document.getElementById('btn-restart').style.background=currentSet.color_main;
  document.getElementById('finish-title').style.color=currentSet.color_main;
  const ts=`background:${currentSet.color_light};color:${currentSet.color_dark};`;
  document.getElementById('op-tag-front').textContent=currentSet.op_label;
  document.getElementById('op-tag-front').style.cssText=ts;
  document.getElementById('op-tag-back').textContent=currentSet.op_label;
  document.getElementById('op-tag-back').style.cssText=ts;
  document.getElementById('screen-menu').style.display='none';
  document.getElementById('screen-app').style.display='block';
  showCard();
}
function goMenu(){
  document.getElementById('screen-app').style.display='none';
  document.getElementById('screen-finish').style.display='none';
  document.getElementById('screen-menu').style.display='block';
  renderMenu();
}
function showCard(){
  if(idx>=deck.length){finish();return}
  const c=deck[idx];
  document.getElementById('problem').textContent=c[0]+' '+c[1]+' '+c[2]+' =';
  document.getElementById('back-eq').textContent=c[0]+' '+c[1]+' '+c[2]+' =';
  document.getElementById('answer').textContent=c[3];
  document.getElementById('card-body').classList.remove('flipped');
  document.getElementById('btn-flip').style.display='';
  document.getElementById('ans-row').style.display='none';
  document.getElementById('nl-strip').classList.remove('visible');
  flipped=false;drawNumberLine(c[0],c[1],c[2],c[3]);updateUI();
}
function flipCard(){
  if(flipped)return;flipped=true;
  document.getElementById('card-body').classList.add('flipped');
  setTimeout(()=>{document.getElementById('btn-flip').style.display='none';document.getElementById('ans-row').style.display='flex';document.getElementById('nl-strip').classList.add('visible');},400);
}
function navCard(dir){idx=(idx+dir+deck.length)%deck.length;showCard();}
function grade(ok){
  const k=cardKey(deck[idx]);
  if(answered[idx]===undefined){if(ok)correct++;else wrong++;}else{if(answered[idx])correct--;else wrong--;if(ok)correct++;else wrong++;}
  answered[idx]=ok;
  if(ok){weights[k]=Math.max(1,(weights[k]||1)-1);}else{weights[k]=(weights[k]||1)+3;}
  saveWeights();const ni=idx+1;if(ni>=deck.length)finish();else{idx=ni;showCard();}
}
function updateUI(){
  document.getElementById('s-total').textContent=deck.length;
  document.getElementById('s-right').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  const ac=Object.keys(answered).length;
  document.getElementById('prog').style.width=(deck.length?Math.round(ac/deck.length*100):0)+'%';
  document.getElementById('round-badge').textContent=(idx+1)+' / '+deck.length;
  const weak=Object.entries(weights).filter(([k,w])=>w>=4).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const row=document.getElementById('weak-row');row.innerHTML='';
  for(const [k,w] of weak){const s=document.createElement('span');s.className='chip';s.textContent='⚠ '+k;row.appendChild(s)}
  const wc=Object.values(weights).filter(w=>w>=4).length;
  document.getElementById('memory-hint').innerHTML=wc>0?'💾 Gespeichert · <span>'+wc+' im Training</span>':'💾 Fortschritt wird gespeichert';
}
function finish(){
  document.getElementById('screen-app').style.display='none';
  document.getElementById('screen-finish').style.display='flex';
  const tot=correct+wrong,pct=tot?Math.round(correct/tot*100):0;
  document.getElementById('finish-sub').textContent=correct+' von '+tot+' Aufgaben richtig';
  document.getElementById('score-pct').textContent=pct+'%';
  const arc=document.getElementById('ring-arc');
  arc.style.stroke=pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626';
  setTimeout(()=>{arc.style.transition='stroke-dashoffset 1s ease';arc.style.strokeDashoffset=289-289*pct/100;},100);
  document.getElementById('finish-emoji').textContent=pct>=80?'🌟':pct>=50?'💪':'🔥';
  const weak=Object.entries(weights).filter(([k,w])=>w>=4).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const ws=document.getElementById('weak-section'),wi=document.getElementById('weak-items');
  if(weak.length){ws.style.display='block';wi.innerHTML='';for(const [k,w] of weak){const d=document.createElement('div');d.className='weak-item';d.innerHTML='<span>'+k+'</span><span class="err-badge">'+Math.round(w-1)+'× falsch</span>';wi.appendChild(d)}}
  else ws.style.display='none';
}
function restart(){
  idx=0;correct=0;wrong=0;round++;answered={};deck=buildDeck();
  document.getElementById('screen-finish').style.display='none';
  document.getElementById('screen-app').style.display='block';
  const arc=document.getElementById('ring-arc');arc.style.transition='none';arc.style.strokeDashoffset=289;showCard();
}
function resetProgress(){
  if(confirm('Lernfortschritt für diesen Satz zurücksetzen?')){weights={};try{localStorage.removeItem(currentSet.storage_key);}catch(e){}restart();}
}
renderMenu();
